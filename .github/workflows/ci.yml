name: Career Intelligence CI/CD Pipeline

"on":
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Frontend Quality & Build Suite
  # ============================================================================
  frontend-pipeline:
    name: Frontend (Lint, Type-Check, Test, Build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: 3. Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: 4. Lint Frontend (ESLint)
        working-directory: ./frontend
        run: npm run lint

      - name: 5. Type-Check Frontend (TypeScript Compiler)
        working-directory: ./frontend
        run: npm run type-check

      - name: 6. Run Frontend Integration Tests
        working-directory: ./frontend
        run: npm test

      - name: 7. Build Next.js Production Assets
        working-directory: ./frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8000"
          NEXT_TELEMETRY_DISABLED: "1"

  # ============================================================================
  # 2. Backend Quality & Verification Suite
  # ============================================================================
  backend-pipeline:
    name: Backend (Lint, Pytest, Migrations, Seed)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: "pip"

      - name: 3. Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: 4. Run Backend Linting (Flake8)
        run: |
          # Critical syntax errors and undefined variables (causes CI failure)
          flake8 backend/app --count --select=E9,F63,F7,F82 --show-source --statistics
          # Complexity and formatting advisory report
          flake8 backend/app --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

      - name: 5. Run Backend Pytest Suite
        run: |
          pytest backend/tests/ -v --durations=10

      - name: 6. Verify Database Migrations & Canonical Seeding
        run: |
          python3 backend/scripts/migrate.py
          python3 backend/scripts/seed_production.py

  # ============================================================================
  # 3. Docker Container Build & Runtime Health Check Suite
  # ============================================================================
  container-build-and-healthcheck:
    name: Docker Containers & Liveness Health Checks
    runs-on: ubuntu-latest
    needs: [frontend-pipeline, backend-pipeline]
    timeout-minutes: 20

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 3. Build Backend Docker Image
        run: |
          docker build \
            --file backend/Dockerfile \
            --tag career-intel-backend:ci \
            ./backend

      - name: 4. Build Frontend Docker Image
        run: |
          docker build \
            --file frontend/Dockerfile \
            --build-arg NEXT_PUBLIC_API_URL=http://localhost:8000 \
            --tag career-intel-frontend:ci \
            ./frontend

      - name: 5. Launch Test Containers in Isolated Network
        run: |
          docker network create ci-health-net

          # Launch Backend container
          docker run -d \
            --name ci-backend \
            --network ci-health-net \
            -p 8000:8000 \
            -e ENVIRONMENT=development \
            -e DEBUG=false \
            -e SECRET_KEY=ci-testing-entropy-token-32-chars-long-safeguard \
            career-intel-backend:ci

          # Launch Frontend container
          docker run -d \
            --name ci-frontend \
            --network ci-health-net \
            -p 3000:3000 \
            -e NODE_ENV=production \
            -e NEXT_PUBLIC_API_URL=http://localhost:8000 \
            career-intel-frontend:ci

      - name: 6. Run Backend Health Check Probe
        run: |
          echo "Waiting for Backend container to become healthy..."
          timeout 60 bash -c 'until curl -sf http://localhost:8000/health; do sleep 2; done'
          
          echo "Validating Backend health payload..."
          BACKEND_RESPONSE=$(curl -sf http://localhost:8000/health)
          echo "Backend Response: ${BACKEND_RESPONSE}"
          echo "${BACKEND_RESPONSE}" | grep '"status":"healthy"'

      - name: 7. Run Frontend Health Check Probe
        run: |
          echo "Waiting for Frontend container to serve /api/health..."
          timeout 60 bash -c 'until curl -sf http://localhost:3000/api/health; do sleep 2; done'
          
          echo "Validating Frontend health payload..."
          FRONTEND_RESPONSE=$(curl -sf http://localhost:3000/api/health)
          echo "Frontend Response: ${FRONTEND_RESPONSE}"
          echo "${FRONTEND_RESPONSE}" | grep '"status":"healthy"'

      - name: 8. Tear Down Test Containers
        if: always()
        run: |
          docker stop ci-backend ci-frontend 2>/dev/null || true
          docker rm -f ci-backend ci-frontend 2>/dev/null || true
          docker network rm ci-health-net 2>/dev/null || true

  # ============================================================================
  # 4. Production Deployment Placeholder (Manual / Explicit Configuration Only)
  # ============================================================================
  deploy-production-placeholder:
    name: Production Deployment (Gated / Manual Setup Required)
    runs-on: ubuntu-latest
    needs: [container-build-and-healthcheck]
    # NOTE: Automated deployment is strictly disabled until explicitly enabled by DevOps.
    # Set the condition below to 'true' only after configuring required GitHub Secrets.
    if: false
    steps:
      - name: Documented Deployment Step
        run: |
          echo "=================================================================="
          echo "🚀 PRODUCTION DEPLOYMENT PLACEHOLDER"
          echo "This step is deliberately dormant until production secrets are set:"
          echo "  - SECRETS.PROD_HOST"
          echo "  - SECRETS.PROD_SSH_KEY"
          echo "  - SECRETS.PROD_DEPLOY_USER"
          echo "  - SECRETS.DOCKER_REGISTRY_TOKEN"
          echo "=================================================================="
